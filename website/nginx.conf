# Served behind Cloudflare. This file is the server's conf.d/default.conf, so the maps below sit in the http block.

# Vite fingerprints everything under /assets, so it can be cached forever. Other static files keep their names
# across deploys and get a week. HTML, .data (loader data), sitemap and the like must always be revalidated so a
# deploy shows up at once; they are small and nginx answers revalidation with 304s.
map $uri $cache_control {
    default "public, max-age=0, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|webp|avif|gif|ico|svg|woff2?)$ "public, max-age=604800";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    server_tokens off;
    # Relative Location headers, so redirects keep Cloudflare's https scheme and host.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript text/x-script application/javascript application/json
        application/xml application/manifest+json image/svg+xml image/x-icon;

    # Every response, including errors and redirects. add_header is inherited only by locations that set none
    # of their own, so no location below adds headers.
    add_header Cache-Control $cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # One URL per page: /blog/ -> /blog.
    rewrite ^/(.+)/$ /$1 permanent;
    # The equipment encyclopedia is English only; the language switcher used to link localized copies.
    rewrite ^/(?:es|de|fr|pt|ja|zh|zh-tw|ko|it|uk|tr|id|hi|ar)/(equipment(?:/.*)?)$ /$1 permanent;

    location / {
        try_files $uri $uri/index.html =404;
    }

    # React Router's prerendered loader data, fetched on client-side navigation.
    location ~ \.data$ {
        default_type text/x-script;
        try_files $uri =404;
    }

    # Blog posts are written in English and only translated ones get a page in another language (see
    # app/content/blog.server.ts). A localized blog URL without a page goes to the English original.
    location ~ ^/(?:es|de|fr|pt|ja|zh|zh-tw|ko|it|uk|tr|id|hi|ar)/blog(?:/|$) {
        try_files $uri $uri/index.html @english_blog;
    }
    location @english_blog {
        rewrite ^/[^/]+/blog(.*)$ /blog$1 permanent;
    }
}
