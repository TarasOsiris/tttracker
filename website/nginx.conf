server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/index.html =404;
    }

    # Blog posts are written in English and only translated ones get a page in another language (see
    # app/content/blog.server.ts). A localized blog URL without a page goes to the English original.
    location ~ ^/(es|de|fr|pt|ja|zh|zh-tw|ko|it|uk|tr|id|hi|ar)/blog(/|$) {
        try_files $uri $uri/index.html @english_blog;
    }
    location @english_blog {
        rewrite ^/[^/]+/blog(.*)$ /blog$1 permanent;
    }
}
